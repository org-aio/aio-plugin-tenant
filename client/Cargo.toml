[package]
name = "aio-plugin-tenant-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aio-plugin-tenant-model = { path = "../model" }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "071324ed60909f755f19120dcfe3346c73f0ab5d" }
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals", "hooks", "document", "web", "launch"] }
dioxus-icons = { version = "0.1.0", default-features = false }
js-sys = "0.3.77"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.145"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.51"
web-sys = { version = "0.3.77", features = ["Window", "Location"] }

[lints]
workspace = true
